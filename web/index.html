<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Digit Classifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@400;500&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

    <!-- Header -->
    <div class="header">
        <h1>Digit Classifier</h1>
        <span class="tag">MNIST · KNN</span>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
        <span class="dot" id="dot"></span>
        <span id="status-text">Checking API...</span>
        <span style="flex:1"></span>
        <button class="btn" onclick="checkHealth()" style="height:28px;font-size:11px;padding:0 10px">ping</button>
    </div>

    <!-- API URL -->
    <div class="url-row">
        <input type="text" id="api-url" value="http://localhost:8000" placeholder="http://localhost:8000"/>
        <button class="btn" onclick="checkHealth()">connect</button>
    </div>

    <!-- Drop zone -->
    <div class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp"
               onchange="onFileSelect(this.files[0])"/>
        <div class="drop-label">
            <strong>drop image here</strong>
            <p>jpg · png · webp &nbsp;·&nbsp; max 1 mb</p>
        </div>
    </div>
    <p class="size-warn" id="size-warn">File exceeds 1 MB limit.</p>

    <!-- Preview -->
    <div class="preview-wrap" id="preview-wrap">
        <img class="preview-img" id="preview-img" src="" alt="preview"/>
        <button class="clear-btn" onclick="clearFile()">×</button>
        <div class="preview-meta">
            <span id="preview-name"></span>
            <span id="preview-size"></span>
        </div>
    </div>

    <!-- Error -->
    <div class="error-box" id="error-box"></div>

    <!-- Actions -->
    <div class="actions">
        <button class="btn primary" id="predict-btn" onclick="predict()" disabled>
            predict
            <span class="spinner" id="spinner"></span>
        </button>
        <button class="btn" onclick="clearAll()">clear</button>
    </div>

    <!-- Result -->
    <div class="result-block" id="result-block">
        <hr/>
        <p class="section-label">prediction</p>
        <div class="digit-display" id="digit-display">—</div>

        <div class="confidence-row">
            <span class="conf-val" id="conf-val">0%</span>
            <div class="bar-track">
                <div class="bar-fill" id="bar-fill"></div>
            </div>
        </div>

        <p class="section-label">class probabilities</p>
        <div class="prob-grid" id="prob-grid"></div>
    </div>

    <!-- History -->
    <div class="history-section" id="history-section">
        <p class="section-label">recent predictions</p>
        <div class="history-chips" id="history-chips"></div>
    </div>

</div>

<script src="main.js"></script>
</body>
</html>
